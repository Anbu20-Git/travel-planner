<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TravelPlanner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    rgba(0, 60, 100, 0.65),
                    rgba(0, 60, 100, 0.65)
                ),
                url("https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .login-container {
            width: 400px;
            max-width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #0077b6;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #0077b6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #0077b6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #0096c7;
        }

        .register-text {
            margin-top: 25px;
            color: #666;
        }

        .register-text a {
            color: #0077b6;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #0077b6;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .success-message {
            color: #2d6a4f;
            background: #d8f3dc;
        }

        .error-message {
            color: #d90429;
            background: #ffe5e5;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            ✈️ TravelPlanner
        </div>

        <p class="subtitle">
            Welcome back! Login to continue your journey.
        </p>

        <!-- Success message -->
        <div th:if="${success}"
             class="message success-message"
             th:text="${success}">
        </div>

        <!-- Error message -->
        <div th:if="${error}"
             class="message error-message"
             th:text="${error}">
        </div>

        <!-- Login form -->
        <form th:action="@{/login}" method="post">

            <!-- CSRF security token -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login ✈️
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a th:href="@{/register}">Register</a>
        </p>

        <a th:href="@{/}" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
