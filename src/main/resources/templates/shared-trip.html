<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shared Trip - TravelPlanner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 40, 70, 0.75),
                    rgba(0, 20, 45, 0.85)
                ),
                url("https://images.unsplash.com/photo-1500534623283-312aade485b7");

            background-size: cover;
            background-position: center;

            min-height: 100vh;

            color: white;
        }

        .navbar {

            padding: 18px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: rgba(0, 0, 0, 0.25);
        }

        .logo {

            font-size: 24px;

            font-weight: bold;
        }

        .home-btn {

            color: white;

            text-decoration: none;

            padding: 9px 18px;

            border: 1px solid white;

            border-radius: 20px;
        }

        .home-btn:hover {

            background: white;

            color: #0077b6;
        }

        .container {

            width: 90%;

            max-width: 900px;

            margin: 50px auto;
        }

        .hero {

            text-align: center;

            margin-bottom: 35px;
        }

        .hero-icon {

            font-size: 60px;
        }

        .hero h1 {

            font-size: 38px;

            margin: 10px 0;
        }

        .hero p {

            font-size: 17px;

            opacity: 0.9;
        }

        .trip-card {

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(12px);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .destination {

            text-align: center;

            margin-bottom: 30px;
        }

        .destination h2 {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .country {

            font-size: 17px;

            opacity: 0.85;
        }

        .details {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 18px;

            margin-top: 25px;
        }

        .detail-box {

            background: rgba(255, 255, 255, 0.12);

            padding: 20px;

            border-radius: 15px;

            text-align: center;
        }

        .detail-icon {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .detail-title {

            font-size: 13px;

            opacity: 0.75;

            margin-bottom: 5px;
        }

        .detail-value {

            font-size: 17px;

            font-weight: bold;
        }

        .budget {

            margin-top: 25px;

            padding: 20px;

            background: rgba(0, 180, 216, 0.25);

            border-radius: 15px;

            text-align: center;
        }

        .budget-value {

            font-size: 28px;

            font-weight: bold;

            margin-top: 8px;
        }

        .footer {

            text-align: center;

            margin-top: 30px;

            opacity: 0.75;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .hero h1 {

                font-size: 30px;
            }

            .trip-card {

                padding: 25px;
            }

        }

    </style>

</head>

<body>


    <div class="navbar">

        <div class="logo">
            ✈️ TravelPlanner
        </div>

        <a
            href="/"
            class="home-btn">

            Home

        </a>

    </div>


    <div class="container">


        <div class="hero">

            <div class="hero-icon">
                🌍
            </div>

            <h1>
                Shared Travel Plan
            </h1>

            <p>
                Explore this trip planned with TravelPlanner
            </p>

        </div>


        <div class="trip-card">


            <div class="destination">

                <h2
                    th:text="${trip.tripName}">
                    My Trip
                </h2>

                <div class="country">

                    📍

                    <span
                        th:text="${trip.destination.name}">
                        Destination
                    </span>

                    ,

                    <span
                        th:text="${trip.destination.country}">
                        Country
                    </span>

                </div>

            </div>


            <div class="details">


                <div class="detail-box">

                    <div class="detail-icon">
                        📅
                    </div>

                    <div class="detail-title">
                        Start Date
                    </div>

                    <div
                        class="detail-value"
                        th:text="${trip.startDate}">
                        2026-11-10
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-icon">
                        🏁
                    </div>

                    <div class="detail-title">
                        End Date
                    </div>

                    <div
                        class="detail-value"
                        th:text="${trip.endDate}">
                        2026-11-16
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-icon">
                        📍
                    </div>

                    <div class="detail-title">
                        Destination
                    </div>

                    <div
                        class="detail-value"
                        th:text="${trip.destination.name}">
                        Paris
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-icon">
                        📊
                    </div>

                    <div class="detail-title">
                        Status
                    </div>

                    <div
                        class="detail-value"
                        th:text="${trip.status}">
                        PLANNED
                    </div>

                </div>


            </div>


            <div class="budget">

                <div>
                    💰 Planned Travel Budget
                </div>

                <div class="budget-value">

                    ₹

                    <span
                        th:text="${trip.budget}">
                        100000
                    </span>

                </div>

            </div>


        </div>


        <div class="footer">

            ✈️ Plan your next adventure with TravelPlanner

        </div>


    </div>

</body>

</html>
