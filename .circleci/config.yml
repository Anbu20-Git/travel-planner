version: 2.1

jobs:
  test-java:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - run:
          name: Check Java and Maven versions
          command: |
            java -version
            mvn -version

      - run:
          name: Build and test Travel Planner
          command: mvn -B verify

      - store_test_results:
          path: target/surefire-reports

      - persist_to_workspace:
          root: .
          paths:
            - target
          
      - run:   
          name: Prepare versioned release 
          command: | 
            JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1) 
            if [ -z "$JAR_FILE" ]; then 
              echo "ERROR: No application JAR found." 
              exit 1 
            fi
            VERSION="build-${CIRCLE_BUILD_NUM}"
            mkdir -p release 
            cp "$JAR_FILE" "release/travel-planner-${VERSION}.jar" 
            echo "Release version: ${VERSION}"
            ls -lh release/
              
      - store_artifacts: 
          path: release/travel-planner.jar 
          destination: travel-planner-release

workflows:
  build-test-release:
    jobs:
      - test-java
      
      - release-artifact:
          requires:
            - test-java
          filters:
            branches:
              only: main
