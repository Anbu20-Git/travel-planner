version: 2.1

jobs:
  test-java:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - run:
          name: Check Java and Maven versions
          command: |
            java -version
            mvn -version

      - run:
          name: Build and test Travel Planner
          command: mvn -B verify

      - store_test_results:
          path: target/surefire-reports

workflows:
  build-and-test:
    jobs:
      - test-java
